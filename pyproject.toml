[tool.poetry]
name = "SportTracker"
version = "2.1.2"
description = "SportTracker is a self-hosted server for recording and analyzing your workout data."
license = "GPL-3.0-or-later"
authors = ["deadlocker8"]

[[tool.poetry.source]]
name = "TheCodeLabs"
url = "https://pypi.thecodelabs.de"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.14"
thecodelabs-baseutils = { version = "*", source = "TheCodeLabs" }
thecodelabs-flaskutils = { version = "*", source = "TheCodeLabs" }
flask = "3.1.3"
gevent = "26.8.0"
click = "8.5.0"
Flask-SQLAlchemy = "3.1.1"
Flask-Pydantic = "0.14.0"
Flask-Login = "0.6.3"
Flask-Bcrypt = "1.0.1"
Flask-Migrate = "4.1.0"
flask-babel = "4.0.0"
python-dateutil = "2.9.0.post0"
psycopg2 = "2.9.12"
gpxpy = "1.6.2"
faker = "40.38.0"
pillow = "12.3.0"
fitdecode = "0.11.0"
natsort = "8.4.0"

[tool.poetry.group.dev.dependencies]
bandit = "1.9.4"
ruff = "0.16.6"
pre-commit = "4.6.2"
mypy = "2.3.1"
pytest = "9.1.1"
pytest-selenium = "4.1.0"
selenium = "4.48.0"

types-python-dateutil = "*"
types-requests = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    'N999',    # invalid-module-name
    'DTZ001',  # call-datetime-without-tzinfo
    'DTZ002',  # call-datetime-today
    'DTZ005',  # call-datetime-now-without-tzinfo
    'DTZ007',  # call-datetime-strptime-without-zone
    'DTZ011',  # call-date-fromtimestamp
    'SIM102',  # collapsible-if
    'SIM117',  # multiple-with-statements
    'TRY401',  # verbose-log-message
    'BLE001'   # blind-except
]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "flask_babel.*",
    "flask_bcrypt.*",
    "flask_login.*",
    "flask_pydantic.*",
    "flask_migrate.*",
    "TheCodeLabs_BaseUtils.*",
    "TheCodeLabs_FlaskUtils.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = "sporttracker"

[tool.bandit]
exclude_dirs = [
    "./tests/*",
    "./sporttracker/migrations/*",
    "./sporttracker/localization/UpdateLocalization.py"
]
skips = [
    'B311',  # random
    'B404'   # import_subprocess
]